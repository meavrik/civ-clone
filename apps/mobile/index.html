<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Epochs" />
    <meta name="description" content="Build an empire from the first city to the stars." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Epochs</title>
    <style>
      /* The game's chrome: light stone (the panel ramp) with the azure selection. */
      :root {
        --stone: rgb(184 184 190);
        --stone-lit: rgb(244 244 240);
        --stone-shade: rgb(108 108 118);
        --ink: rgb(24 24 32);
        --azure: rgb(44 48 156);
        --azure-lit: rgb(96 100 222);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font: 600 15px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #screen {
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      /* The prompt's buttons. */
      button {
        font: inherit;
        color: var(--ink);
        background: var(--stone);
        border: 2px solid;
        border-color: var(--stone-lit) var(--stone-shade) var(--stone-shade) var(--stone-lit);
        border-radius: 3px;
        padding: 0;
        touch-action: manipulation;
        outline: none;
        cursor: pointer;
      }
      /* The prompt for a city's name, at the top, clear of the phone's keyboard. */
      #ask {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 8px);
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 420px);
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        padding: 8px;
        background: var(--stone);
        border: 2px solid;
        border-color: var(--stone-lit) var(--stone-shade) var(--stone-shade) var(--stone-lit);
        z-index: 2;
      }
      #ask[hidden] { display: none; }
      #ask .title {
        flex: 1 0 100%;
        color: #fff;
        background: var(--azure);
        padding: 3px 6px;
      }
      #ask input {
        flex: 1;
        min-width: 0;
        font: 16px/1.2 ui-monospace, Menlo, monospace; /* 16px, or iOS zooms in */
        color: var(--ink);
        background: var(--stone-lit);
        border: 2px solid;
        border-color: var(--stone-shade) var(--stone-lit) var(--stone-lit) var(--stone-shade);
        padding: 6px;
        user-select: text;
        -webkit-user-select: text;
        touch-action: manipulation;
      }
      #ask button { min-height: 40px; padding: 0 12px; touch-action: manipulation; }
      /* The ring under a finger held still: it closes as the right-click comes. */
      #ring {
        position: fixed;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border: 3px solid rgb(244 244 240 / 0.9);
        border-radius: 50%;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        z-index: 1;
      }
      #ring.holding { animation: hold 450ms ease-in forwards; animation-delay: 120ms; }
      #ring.fired { animation: fired 300ms ease-out forwards; }
      @keyframes hold {
        from { opacity: 0; transform: scale(1.6); }
        to { opacity: 0.9; transform: scale(0.7); }
      }
      @keyframes fired {
        from { opacity: 1; transform: scale(0.7); border-color: var(--azure-lit); }
        to { opacity: 0; transform: scale(1.3); border-color: var(--azure-lit); }
      }
      /* Sideways only: held upright, the phone asks to be turned. */
      #turn {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: var(--stone-lit);
        font-size: 17px;
        text-align: center;
        padding: 24px;
      }
      #turn svg { width: 96px; height: 96px; }
      @media (orientation: portrait) {
        #turn { display: flex; }
      }
      #safe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <canvas id="screen" width="320" height="200"></canvas>
    <div id="ring"></div>
    <div id="turn">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="30" y="14" width="36" height="62" rx="6" />
        <path d="M44 68h8" />
        <path d="M14 58a34 34 0 0 1 10-30" />
        <path d="M18 24l6 4-2 7" />
      </svg>
      <div>Turn your phone sideways to play.</div>
    </div>
    <form id="ask" hidden autocomplete="off">
      <span class="title"></span>
      <input type="text" enterkeyhint="done" autocapitalize="words" autocorrect="off" spellcheck="false" />
      <button type="submit">OK</button>
      <button type="button" class="cancel">Cancel</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
